name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck --shell=bash --external-sources vpn-up.command *.sh

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y bats xmlstarlet openssl
          else
            brew install bats-core xmlstarlet bash
          fi
      - name: Run bats tests
        run: bats tests/

  helper:
    name: helper policy engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # Warnings are errors, and the corpus is mostly malformed input, so the
      # sanitizer runs are where a buffer bug in the validators would surface.
      - name: Build and run the corpus
        run: make -C helper test
      - name: Re-run under UBSan
        run: make -C helper ubsan
      # ASan's runtime hangs in its own initialiser on macOS 26 (before main),
      # so it runs on Linux only. See the note in helper/Makefile.
      - name: Re-run under ASan (Linux only)
        if: runner.os == 'Linux'
        run: make -C helper asan

  integration:
    name: helper integration (Linux, as root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The real binaries, as root, against a stand-in OpenConnect. Linux only:
      # macOS helper mode fails closed until the dyld closure work (design step
      # 13), so there is nothing to run end to end there yet.
      - name: End-to-end with a stand-in OpenConnect
        run: |
          set -o pipefail
          VPN_UP_INTEGRATION=1 helper/t/integration/run.sh 2>&1 | tee /tmp/integration.log
          # A test that skips in CI has verified nothing, and would report green
          # forever. The script skips deliberately when its preconditions are
          # absent; here their absence is itself the failure.
          if grep -q '^SKIPPED' /tmp/integration.log; then
            echo "::error::the integration test skipped in CI, so it verified nothing"
            exit 1
          fi
      # Questions only the real OpenConnect can answer: which proxy schemes it
      # supports (design section 17.5) and whether it leaves an inherited locked
      # descriptor alone (section 18). Both are version-dependent, so they are a
      # test rather than a note in the design document.
      - name: Real OpenConnect assumptions
        run: |
          sudo apt-get update
          sudo apt-get install -y openconnect
          helper/t/integration/openconnect-probe.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the point is to catch a credential in ANY commit, not
          # just the tip.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks finds .gitleaks.toml in the scan root on its own; naming it
          # here makes the dependency visible in the workflow instead of implicit,
          # so a config that stops being read fails loudly rather than silently
          # reverting to the stock rules.
          GITLEAKS_CONFIG: .gitleaks.toml
      # The report, whether or not the scan passed. A finding is a file and a
      # line number, and without this the only way to see which is to install
      # gitleaks and reproduce the scan locally — which is exactly what happened
      # the first time this job failed.
      - name: Upload the gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore
