name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck --shell=bash --external-sources vpn-up.command *.sh

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y bats xmlstarlet openssl
          else
            brew install bats-core xmlstarlet bash
          fi
      - name: Run bats tests
        run: bats tests/

  helper:
    name: helper policy engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # Warnings are errors, and the corpus is mostly malformed input, so the
      # sanitizer runs are where a buffer bug in the validators would surface.
      - name: Build and run the corpus
        run: make -C helper test
      - name: Re-run under UBSan
        run: make -C helper ubsan
      # ASan's runtime hangs in its own initialiser on macOS 26 (before main),
      # so it runs on Linux only. See the note in helper/Makefile.
      - name: Re-run under ASan (Linux only)
        if: runner.os == 'Linux'
        run: make -C helper asan

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
